<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>もしもノート｜終活・人生整理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f7f7f9;
      --fg: #222222;
      --accent: #c03a7a;
      --accent-soft: #fbe7f1;
      --border: #dddddd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.7;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    header {
      padding: 40px 0 32px;
    }

    .logo {
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 16px;
    }

    .hero-title {
      font-size: 28px;
      line-height: 1.5;
      margin: 0 0 16px;
    }

    .hero-sub {
      font-size: 15px;
      color: #555;
      margin-bottom: 24px;
    }

    .hero-service {
      font-size: 14px;
      color: #777;
      margin-bottom: 24px;
    }

    .cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-primary {
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-secondary {
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: #444;
      font-size: 14px;
      cursor: pointer;
    }

    .hero-note {
      font-size: 12px;
      color: #888;
    }

    section {
      margin: 40px 0;
      padding: 24px 20px;
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #eee;
    }

    section h2 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 12px;
    }

    section p {
      margin: 8px 0;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .chip {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background
